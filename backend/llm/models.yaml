# The models Foresight may call, as data (docs/06 §13): what each accepts and what it costs. Every
# call goes to OpenAI (owner decision 20 Oct 2026, docs/00 §12 item 14). Choosing or swapping a model
# is configuration: set MODEL_<TIER> (and _FALLBACK), and add the model here if it is new;
# MODELS_FILE can point at another copy of this file.
#
# History: capabilities were first probed through the Mesh gateway (13 Oct 2026), where the OpenAI
# models accepted json_schema (strict) and a forced tool choice. The Anthropic and Google entries
# used then were removed with Mesh (23 Oct 2026); their trial reports keep the findings.
# Prices: USD per million tokens (input, output), copied from Mesh's catalogue (GET /v1/models,
# 13 Oct). gpt-6-luna and gpt-6.1-sol matched OpenAI's list prices on 16 Oct (docs/11); gpt-6-sol's
# price is not checked against OpenAI's yet. No prompt-cache discount is assumed.
defaults:
  # An unlisted model: the conservative shape, and no cost estimate (never a guessed price).
  supports_temperature: false
  supports_forced_tool_choice: false
  structured_mode: json_schema
provider_defaults: {}
models:
  # OpenAI direct (probed 21 Oct 2026): the GPT-6 models accept only the default temperature and
  # answer 400 to 0.0; Mesh dropped it for us. Recordings keep the requested temperature as their key.
  openai/gpt-6-luna:
    {supports_temperature: false, supports_forced_tool_choice: true, structured_mode: json_schema, price_in: 0.10, price_out: 0.50}
  openai/gpt-6.1-sol:
    {supports_temperature: false, supports_forced_tool_choice: true, structured_mode: json_schema, price_in: 2.00, price_out: 10.00}
  openai/gpt-6-sol:  # 20 Oct 2026 all-OpenAI trial: Mesh catalogue price; capabilities assumed as 6.1 Sol
    {supports_temperature: false, supports_forced_tool_choice: true, structured_mode: json_schema, price_in: 2.00, price_out: 10.00}
  openai/gpt-5.6-luna-pro:  # probed 13 Oct 2026 (Advisor model trial): json_schema, forced tools, temperature
    {supports_temperature: true, supports_forced_tool_choice: true, structured_mode: json_schema, price_in: 0.25, price_out: 1.50}
