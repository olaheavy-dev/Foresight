# Foresight locale pack: United Kingdom (`uk`). DATA ONLY — no engine code may hard-code any of it.
#
# Schema (v2: one identity schema shared by both loaders). Consumers: backend/finance_core/locale.py (general loader, fork B) and
# backend/finance_core/categorise/pack.py (categorisation/detection subset). Unknown keys are ignored.
#
#   key, country, subdivision           identity; country (ISO 3166-1) and subdivision also select
#                                       the python-holidays calendar
#   default_currency, locale            ISO 4217 home currency, BCP 47 locale
#   date_order                          preferred order when a file's dates are ambiguous (DMY|MDY|YMD)
#   numbers                             {decimal_sep, group_sep, grouping: thousands|lakh}
#   month_names                         optional extra month spellings {name: month number}
#   payday                              weekend/holiday shift for pay, December early-pay handling
#   debit_posting                       weekend/holiday shift for DD/SO posting
#   channels                            [{channel, bank_types: [exact bank "Type" strings],
#                                         codes: [narration tokens]}]  -> types.Channel values
#   noise_tokens                        tokens dropped when deriving a counterparty
#   reference_markers                   words introducing a trailing invoice/reference number
#                                       ("SEVERN STUDIO INV 178"); dropped with the number
#   payroll_markers / government_payers  inflow-ladder signals (docs/00 §6a)
#   refund_markers, card_bill_markers, self_transfer_markers, savings_markers
#   subscription_families               {family: [merchant tokens]} for overlap detection
#   categories                          [{key, nature, default_flow_kind}]  (docs/07 §3.3 taxonomy)
#   rules                               [{category, flow_kind?, direction: out|in|any,
#                                         merchants: [tokens], patterns: [regex]}]
#   bank_category_priors                {bank: {bank_category: category_key}}  (weak prior only; bank and
#                                       category names are matched by bank_category_key())
#   protected_categories                never targeted by cut/cap/cancel advice
#   seasonal_defaults                   {category_key: [active months]} when history < 12 months
#   wording                             regulator + tone notes

key: uk
country: GB
subdivision: ENG
default_currency: GBP
locale: en-GB
date_order: DMY

numbers:
  decimal_sep: "."
  group_sep: ","
  grouping: thousands

payday:
  weekend_shift: previous_working_day
  december_early_pay: learn_from_history
  one_off_multiple: 1.5          # credits > 1.5x the stream median are bonus/arrears one-offs

debit_posting:
  weekend_shift: next_working_day

channels:
  - channel: card
    bank_types: ["Card payment", "Card Payment", "Merchant", "Debit card"]
    codes: [DEB, POS, CARD]
  - channel: direct_debit
    bank_types: ["Direct Debit", "Direct debit"]
    codes: [DD]
  - channel: standing_order
    bank_types: ["Standing order", "Standing Order"]
    codes: [SO, STO]
  - channel: faster_payment_out
    bank_types: ["Faster payment", "Faster Payment", "Transfer"]
    codes: [FPO, FP]
  - channel: faster_payment_in
    bank_types: ["Top up", "Top-up"]
    codes: [FPI]
  - channel: bacs_credit
    bank_types: ["Bacs (Direct Credit)", "BACS", "Bacs"]
    codes: [BGC, BACS]
  - channel: transfer
    bank_types: ["Pot transfer", "Exchange"]
    codes: [TFR]
  - channel: cash
    bank_types: ["ATM", "Cash"]
    codes: [CPT, ATM, CASH]

noise_tokens: [GB, GBR, UK, LONDON, LTD, LIMITED, PLC, "&", CO, COM, WWW, "THE"]
reference_markers: [INV, INVOICE, REF, REFERENCE, NO, NUM, ORDER, ORD, PO, BOOKING, ACCT, ACC]

payroll_markers: [SALARY, PAYROLL, WAGES, PAY, LTD, LIMITED, PLC, LLP]
government_payers:
  - {pattern: "\\bDWP\\b|UNIVERSAL CREDIT", category: income.benefits}
  - {pattern: "HMRC CHILD BENEFIT|CHILD BENEFIT", category: income.benefits}
  - {pattern: "HMRC.*(REFUND|REPAYMENT)|TAX REFUND", category: income.other}
  - {pattern: "COUNCIL.*(REFUND|REBATE)", category: income.other}

refund_markers: [REFUND, REFD, RETURN, REVERSAL]
card_bill_markers: ["CAPITAL ONE", "TESCO BANK", BARCLAYCARD, "AMERICAN EXPRESS", AMEX, "MBNA", "VANQUISH", "AQUA CARD", "PAYMENT RECEIVED THANK YOU"]
self_transfer_markers: ["TO SELF", "OWN ACCOUNT", "PERSONAL ACCOUNT"]
savings_markers: ["POT TRANSFER", "SAVINGS POT", "TO POT", "PREMIUM BONDS", "NS&I", "MONEYBOX", "VANGUARD", "TRADING 212", "CHIP", "PLUM", "ISA"]

subscription_families:
