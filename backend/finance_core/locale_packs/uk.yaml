  music: [SPOTIFY, "APPLE MUSIC", "YOUTUBE MUSIC", "AMAZON MUSIC", TIDAL, DEEZER]
  cloud_storage: [ICLOUD, "GOOGLE ONE", DROPBOX, "MICROSOFT 365"]
