# Publish images to GHCR only after CI is green on main (docs/05 §12, docs/01 FR-87).
# Watchtower on the VPS (scope foresight-staging) rolls out the new :main images.
# Pull requests never publish.
name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: BUILD_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/foresight-${{ matrix.name }}:sha-${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository_owner }}/foresight-${{ matrix.name }}:main
