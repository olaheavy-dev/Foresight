# Publish images to GHCR only after CI is green on main (docs/05 §12, docs/01 FR-87).
# Watchtower on the VPS (scope foresight-staging) rolls out the new :main images.
# Pull requests never publish.
name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      # Check out main itself, never a ref taken from the triggering run, then refuse to
      # publish unless main still points at the commit CI just checked. If main has moved on,
      # the newer commit's own CI run publishes it.
      - uses: actions/checkout@v5
      - name: Main still points at the CI-checked commit
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$CHECKED_SHA" ]; then
            echo "::error::main moved on since CI checked $CHECKED_SHA; the newer commit's CI run will publish."
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          build-args: BUILD_SHA=${{ github.event.workflow_run.head_sha }}
          tags: foresight-${{ matrix.name }}:candidate
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refuse to publish an image with secrets or private files
        run: python -m tools.check_image_secrets foresight-${{ matrix.name }}:candidate
      - name: Push exactly the image that was checked
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/foresight-${{ matrix.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for tag in "sha-$SHA" main; do
            docker tag "foresight-${{ matrix.name }}:candidate" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
